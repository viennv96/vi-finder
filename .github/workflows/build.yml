name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal app (Apple Silicon + Intel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build ViFinder.app (arm64 + x86_64)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          scripts/build-app.sh release universal

      - name: Verify architectures
        run: |
          ARCHS="$(lipo -archs build/ViFinder.app/Contents/MacOS/ViFinder)"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]

      - name: Package ViFinder.dmg and ViFinder.zip
        run: scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViFinder
          path: |
            build/ViFinder.dmg
            build/ViFinder.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/ViFinder.dmg build/ViFinder.zip \
            --title "ViFinder ${GITHUB_REF_NAME#v}" --generate-notes
